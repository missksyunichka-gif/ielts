<style>

  table.res{width:100%;border-collapse:collapse;font-size:15px}
  table.res td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer.low{color:var(--bad)}

</head>

    </div>
    <p><button class="primary" id="nextBtn" onclick="next()" disabled>Ответить →</button></p>
  </div>
  <div class="card hidden" id="doneCard">

    <p class="muted" id="doneNote"></p>
    <button class="primary" id="sendBtn" onclick="sendResults()">📨 Отправить учителю</button>

    <textarea id="copyBox" class="hidden" style="width:100%;height:180px;font:13px monospace;margin-top:8px"></textarea>

</div>
</div>

const WORDS=SETS.flatMap(s=>s.words.map(w=>Object.assign({set:s.id},w)));
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){ return (s||"").toLowerCase().replace(/[’']/g,"").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim(); }
const alts=w=>[w.en, w.en.replace(/^(a|the) /,"")];
// дистракторы — из того же набора (так сложнее), той же части речи, если хватает
function distract(w,f){ let p=WORDS.filter(x=>x.en!==w.en&&x.set===w.set&&x.pos===w.pos); if(p.length<3) p=WORDS.filter(x=>x.en!==w.en&&x.set===w.set); return shuffle(p).slice(0,3).map(f); }
function ctxParts(w){ const m=w.ex.match(new RegExp(w.en.replace(/[-]/g,"\\-"),"i")); return {before:w.ex.slice(0,m.index),after:w.ex.slice(m.index+m[0].length)}; }
const blankOf=en=>en.split(" ").map(p=>[...p].map((c,i)=>i===0?c:c==="-"?"-":"_").join(" ")).join("   ");
function makeQ(w,t){
  if(t==="def") return {t,w,ans:w.en,opts:shuffle([w.en,...distract(w,x=>x.en)])};
  if(t==="tr")  return {t,w,ans:w.ru,opts:shuffle([w.ru,...distract(w,x=>x.ru)])};
  if(t==="ctx") return Object.assign({t,w,ans:w.en},ctxParts(w));
  return {t:"wr",w,ans:w.en};
}
const TASK={def:"Прочитай определение и выбери слово.",tr:"Выбери перевод.",ctx:"Вставь слово в предложение. Даны первые буквы, черточка = буква.",wr:"Напиши по-английски, без подсказок."};
function promptHTML(q){
  if(q.t==="def") return '<span style="font-size:20px;font-weight:500">'+esc(q.w.def)+'</span>';
  if(q.t==="tr")  return esc(q.w.en)+' <span class="muted" style="font-size:15px;font-weight:400">('+q.w.pos+')</span>';
  if(q.t==="ctx") return '<span style="font-size:20px;font-weight:500">'+esc(q.before)+'<b style="white-space:pre-wrap;font-family:monospace;color:var(--accent)">'+esc(blankOf(q.w.en))+'</b>'+esc(q.after)+'</span>';
  return esc(q.w.ru)+' <span class="muted" style="font-size:15px;font-weight:400">('+q.w.pos+')</span>';
}
function isOkQ(q,a){ if(a==null) return false; if(q.t==="def"||q.t==="tr") return a===q.ans; return alts(q.w).some(x=>norm(x)===norm(a)); }
const qLabel=q=>q.t==="def"?q.w.def:q.t==="tr"?q.w.en:q.t==="ctx"?q.before+"(…)"+q.after:q.w.ru;

const $=id=>document.getElementById(id);
const KEY="ielts_test_band9_ads_v1";
let S=null;
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function load(){ try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null} }
function makeTest(){
  const all=shuffle(WORDS); let k=0; const take=n=>all.slice(k,k+=n);
  const d=take(PLAN.def), c=take(PLAN.ctx), w=take(PLAN.wr), t=all.slice(k);
  return [...d.map(x=>makeQ(x,"def")),...c.map(x=>makeQ(x,"ctx")),...t.map(x=>makeQ(x,"tr")),...w.map(x=>makeQ(x,"wr"))];
}
function start(){
  const n=$("nameInput").value.trim(); if(!n){$("nameInput").focus();return;}
  const old=load();
  if(old&&old.name===n&&!old.sent) S=old;
  else S={name:n,started:Date.now(),qs:makeTest(),i:0,answers:[],finished:false,sent:false};

  tick(); TIMER=setInterval(tick,1000);
  if(S.finished) finish(); else show();
}
let TIMER=null, pick=null;
function left(){ return MINUTES*60-Math.floor((Date.now()-S.started)/1000); }
function tick(){ const l=Math.max(0,left()); $("timer").textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0"); $("timer").classList.toggle("low",l<=60);
  if(l<=0&&!S.finished) finish(true); }
function show(){
  const q=S.qs[S.i]; pick=null;
  $("bar").style.width=(100*S.i/S.qs.length)+"%"; $("qNum").textContent="Вопрос "+(S.i+1)+" из "+S.qs.length; $("qTask").textContent=TASK[q.t];
  $("qPrompt").innerHTML=promptHTML(q); $("qOpts").innerHTML=""; $("nextBtn").disabled=true;
  if(q.t==="ctx"||q.t==="wr"){ $("qWrite").classList.remove("hidden"); $("qIn").value=""; $("qIn").oninput=()=>$("nextBtn").disabled=!$("qIn").value.trim(); $("qIn").focus(); return; }
  $("qWrite").classList.add("hidden");
  q.opts.forEach(o=>{ const b=document.createElement("button"); b.textContent=o;
    b.onclick=()=>{ [...$("qOpts").children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick=o; $("nextBtn").disabled=false; };

}

function next(){
  if(S.finished) return; const q=S.qs[S.i];

function finish(timeout){
  S.finished=true; if(!S.endedAt) S.endedAt=Date.now(); save(); clearInterval(TIMER);

  if(S.sent) showReview();
}
function score(){ return S.qs.filter((q,i)=>isOkQ(q,S.answers[i])).length; }
function buildReport(){
  const secs=Math.round(((S.endedAt||Date.now())-S.started)/1000);
  let t="📝 <b>Проверочная · Advertising (band 9)</b>\n👤 "+esc(S.name)+"\n🕒 "+new Date(S.started).toLocaleString("ru-RU")+" · "+Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0")+"\n🎯 <b>"+score()+" / "+S.qs.length+"</b>\n";
  const NAME={def:"Слово по определению",ctx:"Слово в предложении",tr:"Перевод",wr:"Написание по переводу"};
  let last=null;
  S.qs.forEach((q,i)=>{ if(q.t!==last){ t+="\n<b>"+NAME[q.t]+"</b> ("+S.qs.filter((x,j)=>x.t===q.t&&isOkQ(x,S.answers[j])).length+"/"+S.qs.filter(x=>x.t===q.t).length+")"; last=q.t; }
    const a=S.answers[i], ok=isOkQ(q,a);
    if(!ok) t+="\n❌ "+esc(q.w.en)+" — ответ: "+esc(a==null?"не успел(а)":a); });
  const wrong=S.qs.filter((q,i)=>!isOkQ(q,S.answers[i])).map(q=>q.w.en);
  if(wrong.length) t+="\n\n🔁 <b>Повторить:</b> "+esc(wrong.join(", ")); else t+="\n\n🎉 Без ошибок!";
  return t;
}
function showReview(){
  let h='<h3>Твой результат: '+score()+' / '+S.qs.length+'</h3><table class="res">';
  S.qs.forEach((q,i)=>{ const a=S.answers[i], ok=isOkQ(q,a);
    h+='<tr><td>'+(ok?"✅":"❌")+'</td><td>'+esc(qLabel(q))+'</td><td>'+(ok?esc(a):'<s>'+esc(a==null?"—":a)+'</s> <b>'+esc(q.ans)+'</b>')+'</td></tr>'; });
  $("review").innerHTML=h+'</table>'; $("review").classList.remove("hidden");
}
function chunks(text){ const out=[]; let cur=""; text.split("\n").forEach(l=>{ if((cur+"\n"+l).length>3800){ out.push(cur); cur=l; } else cur=cur?cur+"\n"+l:l; }); if(cur)out.push(cur); return out; }
async function sendResults(){
  const text=buildReport(); $("sendBtn").disabled=true; $("sendFb").textContent="Отправляю…";
  try{ for(const part of chunks(text)){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:part,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description); }
    $("sendFb").textContent="✅ Отправлено! Молодец!"; S.sent=true; save(); showReview(); }
  catch(e){ $("sendBtn").disabled=false; $("sendFb").textContent="Не получилось отправить ("+e.message+"). Скопируй текст и отправь вручную:"; const b=$("copyBox"); b.value=text.replace(/<\/?b>/g,""); b.classList.remove("hidden"); b.select(); }
}
</script>
