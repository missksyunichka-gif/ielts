<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Лиса в лесу 🦊🌳</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(#e9f9ff 0%, #f3fbe9 65%, #d6efb8 100%); color: #234022; overflow: hidden; touch-action: manipulation;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; padding: 14px; }
  .screen.on { display: flex; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 44px); text-align: center; }
  .btn { border: none; border-radius: 26px; background: #fff; box-shadow: 0 6px 0 #9cc77a; color: #234022; cursor: pointer; font-size: 18px; padding: 14px 12px; font-family: inherit; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9cc77a; }
  .btn .em { display: block; font-size: 52px; line-height: 1.1; }
  .btn .ko { display: block; font-size: 28px; font-weight: 800; margin: 4px 0; }
  #menu { justify-content: center; gap: 16px; }
  .modes { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 960px; width: 100%; }
  .modes .btn { flex: 1 1 230px; max-width: 290px; }
  .note { font-size: 14px; opacity: .7; text-align: center; max-width: 640px; }

  /* top bar + tree */
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .iconbtn { border: none; background: #fff; border-radius: 50%; width: 56px; height: 56px; font-size: 28px; box-shadow: 0 4px 0 #9cc77a; cursor: pointer; }
  .treebox { position: fixed; left: 12px; bottom: 8px; width: 150px; height: 190px; display: flex; align-items: flex-end; justify-content: center; z-index: 1; pointer-events: none; }
  .tree { font-size: 40px; line-height: 1; transition: font-size .6s cubic-bezier(.3,1.6,.5,1); }
  .tree-label { position: fixed; left: 12px; bottom: 2px; width: 150px; text-align: center; font-weight: 800; font-size: 18px; z-index: 2; }

  .fox { font-size: clamp(64px, 12vw, 100px); line-height: 1; cursor: pointer; }
  .fox.no { animation: shake .45s ease; }
  .fox.yes { animation: chomp .5s ease 2; }
  .bubble { background: #fff; border-radius: 26px; padding: 10px 22px; font-size: clamp(30px, 6vw, 50px); font-weight: 800; box-shadow: 0 4px 0 #9cc77a; cursor: pointer; min-width: 110px; text-align: center; }
  .foxrow { display: flex; align-items: center; gap: 12px; z-index: 5; }

  /* mode 1: butterflies */
  #sky { position: absolute; inset: 0; overflow: hidden; }
  .bfly { position: absolute; width: 130px; height: 120px; cursor: pointer; display: flex; flex-direction: column; align-items: center; z-index: 3; }
  .bfly .wing { font-size: 74px; line-height: 1; animation: flap .5s ease-in-out infinite alternate; }
  .bfly .s { margin-top: -8px; background: #fff; border-radius: 16px; padding: 0 12px; font-size: 38px; font-weight: 900; box-shadow: 0 3px 0 #c9b6ea; }
  .bfly.caught { animation: toTree .9s ease-in forwards; pointer-events: none; }
  .bfly.wrong .s { animation: shake .45s ease; background: #ffe1e1; }

  /* mode 2: magic ㄴ */
  .builder { display: flex; align-items: center; gap: 18px; margin-top: 10px; z-index: 5; }
  .slot { width: clamp(150px, 26vw, 230px); height: clamp(150px, 26vw, 230px); background: #fff; border-radius: 30px; box-shadow: 0 6px 0 #9cc77a; display: flex; align-items: center; justify-content: center; font-size: clamp(100px, 18vw, 170px); font-weight: 900; }
  .slot.made { background: #fffbe0; animation: pop .45s ease; }
  .plus { font-size: 46px; font-weight: 900; opacity: .6; }
  .vowels { display: flex; gap: clamp(12px, 3vw, 28px); margin: 16px 0 10px; z-index: 5; }
  .vbtn { width: clamp(100px, 17vw, 150px); height: clamp(100px, 17vw, 150px); border: none; border-radius: 26px; background: #fff; box-shadow: 0 6px 0 #9cc77a; font-size: clamp(64px, 11vw, 100px); font-weight: 900; cursor: pointer; color: #c4531a; font-family: inherit; }
  .vbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9cc77a; }
  .vbtn.wrong { animation: shake .45s ease; opacity: .4; }

  /* mode 3: where is */
  .pics { display: grid; grid-template-columns: repeat(2, minmax(130px, 220px)); gap: 18px; margin: 14px 0; z-index: 5; }
  .pbtn { height: clamp(120px, 21vh, 190px); border: none; border-radius: 28px; background: #fff; box-shadow: 0 6px 0 #9cc77a; font-size: clamp(70px, 12vh, 120px); cursor: pointer; }
  .pbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9cc77a; }
  .pbtn.wrong { animation: shake .45s ease; opacity: .4; }
  .pbtn.right { background: #e3f7d8; animation: pop .45s ease; }

  #win { justify-content: center; gap: 14px; text-align: center; }
  .bigtree { font-size: 180px; line-height: 1; position: relative; }
  .bigtree span { position: absolute; font-size: 46px; animation: flap .5s ease-in-out infinite alternate; }
  #win h2 { font-size: 54px; margin: 0; }

  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.6); } }
  @keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }
  @keyframes chomp { 30% { transform: scale(1.2) rotate(-6deg); } 60% { transform: scale(.95) rotate(4deg); } }
  @keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.12); } }
  @keyframes toTree { to { left: 40px; top: calc(100vh - 200px); transform: scale(.3); opacity: .2; } }
</style>
</head>
<body>

<div class="treebox"><div class="tree" id="tree">🌱</div></div>
<div class="tree-label">나무</div>

<div id="menu" class="screen on">
  <div style="font-size:clamp(70px,16vw,120px);line-height:1">🦊🌳🦋</div>
  <h1>Лиса в лесу<br><span style="font-size:.65em">숲에 가자!</span></h1>
  <div class="modes">
    <button class="btn" data-mode="bfly"><span class="em">🦋🦋</span><span class="ko">나비 잡기</span>Поймай бабочку</button>
    <button class="btn" data-mode="magic"><span class="em">✨</span><span class="ko">ㄴ + ㅏ = 나</span>Волшебная ㄴ</button>
    <button class="btn" data-mode="where"><span class="em">🌳🦋🐸🦊</span><span class="ko">어디 있어?</span>Где…?</button>
  </div>
  <div class="note">🔊 Включите звук. Нажимайте мышкой (или пальцем). За каждый правильный ответ дерево 나무 растёт 🌱→🌳. Нажмите на лису — она повторит.</div>
</div>

<!-- mode 1 -->
<div id="bfly" class="screen">
  <div class="top"><button class="iconbtn home">🏠</button>
    <div class="foxrow"><div class="fox" id="fox1">🦊</div><div class="bubble" id="bub1"></div></div>
    <button class="iconbtn again">🔊</button></div>
  <div id="sky"></div>
</div>

<!-- mode 2 -->
<div id="magic" class="screen">
  <div class="top"><button class="iconbtn home">🏠</button>
    <div class="foxrow"><div class="fox" id="fox2">🦊</div><div class="bubble" id="bub2"></div></div>
    <button class="iconbtn again">🔊</button></div>
  <div class="builder">
    <div class="slot">ㄴ</div><div class="plus">+</div><div class="slot" id="vslot">?</div><div class="plus">=</div><div class="slot" id="result"> </div>
  </div>
  <div class="vowels" id="vowels"></div>
</div>

<!-- mode 3 -->
<div id="where" class="screen">
  <div class="top"><button class="iconbtn home">🏠</button>
    <div class="foxrow"><div class="fox" id="fox3">🦊</div><div class="bubble" id="bub3"></div></div>
    <button class="iconbtn again">🔊</button></div>
  <div class="pics" id="pics"></div>
</div>

<div id="win" class="screen">
  <div class="bigtree">🌳<span style="left:-20px;top:20px">🦋</span><span style="right:-24px;top:50px">🦋</span><span style="left:60px;top:-30px">🦋</span></div>
  <h2>잘했어!</h2>
  <div style="font-size:24px">Дерево 나무 выросло, и бабочки 나비 прилетели!</div>
  <button class="btn" id="playAgain" style="font-size:28px;font-weight:800;padding:14px 40px">또! 🔁</button>
  <button class="btn" id="toMenu">🏠 меню</button>
</div>

<script>
/* ---------- audio ---------- */
const player = new Audio(); let queue = [];
function play(list) { queue = list.slice(); next(); }
function next() {
  const id = queue.shift(); if (!id || !AUDIO[id]) return;
  try { player.pause(); player.src = AUDIO[id]; player.onended = next; const p = player.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}

const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function shake(el) { el.classList.remove("wrong", "no"); void el.offsetWidth; el.classList.add(el.classList.contains("fox") ? "no" : "wrong"); }

/* ---------- tree progress ---------- */
const GOAL = 8; let score = 0, mode = null, again = () => {};
const STAGES = ["🌱", "🌱", "🌿", "🌿", "🪴", "🌳", "🌳", "🌳", "🌳"];
function grow() {
  score++;
  const t = $("tree"); t.textContent = STAGES[Math.min(score, 8)];
  t.style.fontSize = (40 + score * 16) + "px";
  if (score >= GOAL) { stopFly(); setTimeout(win, 1600); return true; }
  return false;
}
function resetTree() { score = 0; $("tree").textContent = "🌱"; $("tree").style.fontSize = "40px"; }
function win() { show("win"); play(["wa"]); }

function start(m) { mode = m; resetTree(); show(m); ({ bfly: startBfly, magic: roundMagic, where: roundWhere })[m](); }

/* ---------- mode 1: catch the butterfly ---------- */
const BSYL = ["나", "니", "누", "아", "이", "노"];
let flyTimer = null, target1 = null, flies = [];
function stopFly() { cancelAnimationFrame(flyTimer); flyTimer = null; }
function startBfly() { roundBfly(); }
function roundBfly() {
  stopFly(); const sky = $("sky"); sky.innerHTML = ""; flies = [];
  target1 = rnd(["나", "니", "누"]);                     /* always a ㄴ-syllable */
  const others = shuffle(BSYL.filter(s => s !== target1)).slice(0, 2);
  const W = innerWidth, H = innerHeight;
  shuffle([target1, ...others]).forEach((s, i) => {
    const el = document.createElement("div"); el.className = "bfly";
    el.innerHTML = `<div class="wing">🦋</div><div class="s">${s}</div>`;
    const f = { el, s, x: 180 + Math.random() * (W - 360), y: 150 + Math.random() * (H - 300), vx: (Math.random() < .5 ? -1 : 1) * (0.6 + Math.random() * .5), vy: (Math.random() < .5 ? -1 : 1) * (0.4 + Math.random() * .4), t: Math.random() * 6 };
    el.onclick = () => catchFly(f);
    sky.appendChild(el); flies.push(f);
  });
  $("bub1").textContent = target1 + "!";
  again = () => play(["s_" + target1]);
  setTimeout(again, 300);
  const step = () => {
    const W = innerWidth, H = innerHeight;
    flies.forEach(f => {
      if (f.done) return;
      f.t += 0.03; f.x += f.vx + Math.sin(f.t) * .4; f.y += f.vy + Math.cos(f.t * 1.3) * .4;
      if (f.x < 170 || f.x > W - 140) f.vx *= -1;
      if (f.y < 120 || f.y > H - 140) f.vy *= -1;
      f.el.style.left = f.x + "px"; f.el.style.top = f.y + "px";
    });
    flyTimer = requestAnimationFrame(step);
  };
  step();
}
function catchFly(f) {
  if (f.done) return;
  if (f.s === target1) {
    f.done = true; f.el.classList.add("caught");
    $("fox1").classList.add("yes"); setTimeout(() => $("fox1").classList.remove("yes"), 1000);
    play(["s_" + f.s, "nyam"]);
    if (!grow()) setTimeout(roundBfly, 1700);
  } else { shake(f.el); shake($("fox1")); play(["s_" + f.s, "aniya", "s_" + target1]); }
}

/* ---------- mode 2: magic ㄴ ---------- */
const VMAP = { "ㅏ": "나", "ㅣ": "니", "ㅜ": "누", "ㅗ": "노" };
let target2 = null, busy2 = false;
function roundMagic() {
  busy2 = false;
  const keys = Object.keys(VMAP);
  target2 = rnd(score < 2 ? ["ㅏ", "ㅣ"] : keys);           /* start easy */
  $("vslot").textContent = "?"; $("vslot").classList.remove("made");
  $("result").textContent = " "; $("result").classList.remove("made");
  $("bub2").textContent = VMAP[target2] + "!";
  const box = $("vowels"); box.innerHTML = "";
  shuffle(score < 2 ? ["ㅏ", "ㅣ", "ㅜ"] : keys).forEach(v => {
    const b = document.createElement("button"); b.className = "vbtn"; b.textContent = v;
    b.onclick = () => pickV(v, b); box.appendChild(b);
  });
  again = () => play(["s_" + VMAP[target2]]);
  setTimeout(again, 300);
}
function pickV(v, el) {
  if (busy2) return;
  $("vslot").textContent = v; $("result").textContent = VMAP[v];
  ["vslot", "result"].forEach(id => { const e = $(id); e.classList.remove("made"); void e.offsetWidth; e.classList.add("made"); });
  if (v === target2) {
    busy2 = true; $("fox2").classList.add("yes"); setTimeout(() => $("fox2").classList.remove("yes"), 1000);
    play(["s_" + VMAP[v], "nyam"]);
    if (!grow()) setTimeout(roundMagic, 2200);
  } else {
    shake(el); shake($("fox2"));
    play(["s_" + VMAP[v], "aniya", "s_" + VMAP[target2]]);   /* hears what she made, then the target */
  }
}

/* ---------- mode 3: where is ---------- */
const PICS = [
  { id: "nabi", em: "🦋", ko: "나비" }, { id: "namu", em: "🌳", ko: "나무" },
  { id: "yeou", em: "🦊", ko: "여우" }, { id: "gaeguri", em: "🐸", ko: "개구리" }
];
let target3 = null, busy3 = false, last3 = null;
function roundWhere() {
  busy3 = false;
  /* 나비/나무 come up twice as often — they are the new words */
  const pool = ["nabi", "namu", "nabi", "namu", "yeou", "gaeguri"].filter(x => x !== last3);
  target3 = PICS.find(p => p.id === rnd(pool)); last3 = target3.id;
  $("bub3").textContent = target3.ko + "?";
  const box = $("pics"); box.innerHTML = "";
  shuffle(PICS).forEach(p => {
    const b = document.createElement("button"); b.className = "pbtn"; b.textContent = p.em;
    b.onclick = () => pickP(p, b); box.appendChild(b);
  });
  again = () => play(["q_where_" + target3.id]);
  setTimeout(again, 300);
}
function pickP(p, el) {
  if (busy3) return;
  if (p.id === target3.id) {
    busy3 = true; el.classList.add("right");
    $("fox3").classList.add("yes"); setTimeout(() => $("fox3").classList.remove("yes"), 1000);
    play(["w_" + p.id, "nyam"]);
    if (!grow()) setTimeout(roundWhere, 2000);
  } else { shake(el); shake($("fox3")); play(["w_" + p.id, "aniya"]); }
}

/* ---------- wiring ---------- */
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { play(["annyeong"]); setTimeout(() => start(b.dataset.mode), 800); });
document.querySelectorAll(".home").forEach(b => b.onclick = () => { stopFly(); try { player.pause(); } catch (e) {} resetTree(); show("menu"); });
document.querySelectorAll(".again").forEach(b => b.onclick = () => again());
["fox1", "fox2", "fox3", "bub1", "bub2", "bub3"].forEach(id => $(id).onclick = () => again());
$("playAgain").onclick = () => start(mode);
$("toMenu").onclick = () => { resetTree(); show("menu"); };
</script>
</body>
</html>
