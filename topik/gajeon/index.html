<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ 가전제품 · игра на повторение</title>
<style>
  :root{--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--bg:#f5f6fa;--card:#fff;--accent:#2f5bea;--ok:#1f9d55;--okbg:#e9f8ef;--bad:#d64545;--badbg:#fdeeee;--fire:#f08c00}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 80px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  header h1{font-size:20px;margin:0}
  .who{font-size:14px;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0000000d}
  h2{margin:0 0 6px;font-size:20px}
  .muted{color:var(--muted);font-size:14px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:#eef0f4;color:var(--ink);margin:4px 4px 4px 0}
  button.primary{background:var(--accent);color:#fff}
  button.dark{background:var(--ink);color:#fff}
  button.sm{font-size:14px;padding:6px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=text]{font:inherit;padding:9px 11px;border:1.5px solid #c9ced8;border-radius:9px;width:100%}
  .ko{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  .hidden{display:none!important}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .modes button{margin:0;padding:12px 8px;text-align:center;line-height:1.3}
  .modes button.active{background:#dfe6ff;outline:2px solid var(--accent)}
  .modes small{display:block;color:var(--muted);font-size:12.5px}
  .hud{display:flex;align-items:center;gap:14px;font-weight:700}
  .hud .time{font-size:22px;min-width:64px}
  .hud .time.low{color:var(--bad)}
  .hud .pts{margin-left:auto;font-size:22px;color:var(--accent)}
  .combo{color:var(--fire);font-size:16px;min-width:70px}
  .bar{height:8px;background:#e7e9ef;border-radius:5px;overflow:hidden;margin:10px 0 4px}
  .bar div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .prompt{text-align:center;margin:22px 0 6px;min-height:76px}
  .prompt .q{font-size:34px;font-weight:700}
  .prompt .tag{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .listen{font-size:40px;padding:10px 26px;border-radius:50%;background:#eef3ff}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .opts button{margin:0;padding:16px 12px;font-size:19px;background:#f1f3f7;position:relative}
  .opts button .k{position:absolute;left:9px;top:6px;font-size:11px;color:#98a2b3}
  .opts button.ok{background:var(--okbg);outline:2px solid var(--ok)}
  .opts button.bad{background:var(--badbg);outline:2px solid var(--bad);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;color:var(--fire);pointer-events:none;opacity:0}
  .pop.go{animation:pop .7s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1.15)}}
  .big{font-size:44px;font-weight:800;color:var(--accent);margin:4px 0}
  .stars{font-size:30px;letter-spacing:4px}
  table.res{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
  table.res td{border-bottom:1px solid var(--line);padding:6px 4px}
  .feedback{min-height:22px;margin-top:8px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chips span{background:#eef0f4;border-radius:8px;padding:3px 9px;font-size:15px}
  @media (max-width:560px){.modes{grid-template-columns:1fr}.opts button{font-size:17px;padding:14px 8px}.prompt .q{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">

<!-- START -->
<div id="startCard" class="card">
  <h2>⚡ 가전제품 · разминка</h2>
  <p class="muted">Быстрая игра на повторение слов про бытовую технику. 90 секунд: отвечай как можно быстрее. За правильный ответ +10, за серию из 3 подряд — бонус 🔥. Ошибки возвращаются в конец.</p>
  <p style="margin-bottom:4px">Как тебя зовут?</p>
  <input type="text" id="nameIn" placeholder="Имя" autocomplete="off" onkeydown="if(event.key==='Enter')startGame()">
  <p style="margin:14px 0 0">Режим:</p>
  <div class="modes" id="modes">
    <button data-m="mix" class="active">🎲 Смешанный<small>всё вперемешку</small></button>
    <button data-m="ru">🇷🇺 → 🇰🇷<small>перевод → слово</small></button>
    <button data-m="audio">🔊 На слух<small>слушай и выбирай</small></button>
  </div>
  <div class="feedback" id="startFb" style="color:var(--bad)"></div>
  <button class="primary" onclick="startGame()">Начать ▶</button>
  <span class="muted" id="best"></span>
  <p class="muted" style="font-size:13px;margin-bottom:0">Клавиши 1–4 выбирают ответ, пробел — повторить звук.</p>
</div>

<!-- GAME -->
<div id="gameCard" class="card hidden">
  <div class="hud">
    <span class="time" id="time">90</span>
    <span class="combo" id="combo"></span>
    <span class="muted" id="left"></span>
    <span class="pts" id="pts">0</span>
  </div>
  <div class="bar"><div id="bar"></div></div>
  <div class="prompt" id="prompt"></div>
  <div class="opts" id="opts"></div>
</div>
<div class="pop" id="pop"></div>

<!-- RESULT -->
<div id="resCard" class="card hidden" style="text-align:center">
  <h2>수고했어요! 👏</h2>
  <div class="stars" id="stars"></div>
  <div class="big" id="final"></div>
  <div class="muted" id="resLine"></div>
  <div id="mistakes" style="text-align:left"></div>
  <div class="feedback" id="sendFb"></div>
  <button class="primary" onclick="startGame()">Ещё раз ↻</button>
  <button onclick="toStart()">Сменить режим</button>
</div>

</div>
<script>
const TG_TOKEN   = "9252730022:AAGhfn1DzR05foOHV6zFiTirJlRqSoUCgTU";
const TG_CHAT_ID = "347625701";
const GAME_SEC = 90;

const WORDS = [
  ["냉장고","холодильник","t"],["세탁기","стиральная машина","t"],["건조기","сушильная машина","t"],
  ["청소기","пылесос","t"],["전자레인지","микроволновка","t"],["밥솥","рисоварка","t"],
  ["에어컨","кондиционер","t"],["선풍기","вентилятор","t"],["다리미","утюг","t"],
  ["드라이기","фен","t"],["식기세척기","посудомоечная машина","t"],["공기청정기","очиститель воздуха","t"],
  ["텔레비전","телевизор","t"],
  ["켜다","включать","v"],["끄다","выключать","v"],["고장 나다","сломаться","v"],["고치다","чинить","v"],
  ["충전하다","заряжать","v"],["설치하다","устанавливать","v"],
  ["배송","доставка","n"],["할인","скидка","n"],["소음","шум","n"],["용량","объём, вместимость","n"]
].map(([ko,ru,g])=>({ko,ru,g}));

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- voice ---- */
let voices=[];
function vRank(v){ const n=v.name; return /Natural|Online|Neural|SunHi|InJoon|Hyunsu/i.test(n)?0:/Google|Yuna|Siri|Premium|Enhanced/i.test(n)?1:2; }
function loadVoices(){ if(!("speechSynthesis" in window)) return; voices=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)).sort((a,b)=>vRank(a)-vRank(b)); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function say(t){ if(!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voices[0]){u.voice=voices[0];u.lang=voices[0].lang;} else u.lang="ko-KR"; u.rate=0.85; speechSynthesis.speak(u); }

/* ---- setup ---- */
let mode="mix";
$("modes").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; mode=b.dataset.m; [...$("modes").children].forEach(x=>x.classList.toggle("active",x===b)); };
try{ const n=localStorage.getItem("gajeon_game_name"); if(n){ $("nameIn").value=n; showBest(); } }catch(e){}
$("nameIn").addEventListener("input",showBest);
function bestKey(){ return "gajeon_game_best_"+$("nameIn").value.trim().toLowerCase(); }
function showBest(){ let b=null; try{ b=localStorage.getItem(bestKey()); }catch(e){} $("best").textContent=b?`🏆 Твой рекорд: ${b}`:""; }

/* ---- game ---- */
let G=null;
function startGame(){
  const name=$("nameIn").value.trim(); if(!name){ $("startFb").textContent="Впиши имя"; $("nameIn").focus(); return; }
  $("startFb").textContent=""; try{ localStorage.setItem("gajeon_game_name",name); }catch(e){}
  G={ name, mode, queue:shuffle(WORDS), done:0, pts:0, streak:0, bestStreak:0, right:0, wrong:0, missed:new Map(), t:GAME_SEC, lock:false, timer:null, cur:null, type:null };
  $("startCard").classList.add("hidden"); $("resCard").classList.add("hidden"); $("gameCard").classList.remove("hidden");
  $("pts").textContent="0"; $("combo").textContent=""; tick(true);
  G.timer=setInterval(tick,1000);
  next();
}
function tick(init){
  if(!init) G.t--;
  $("time").textContent="⏱ "+G.t; $("time").classList.toggle("low",G.t<=10);
  if(G.t<=0) end();
}
function pickType(){
  if(G.mode==="ru") return "ru2ko";
  if(G.mode==="audio") return "audio";
  return ["ru2ko","ko2ru","audio"][Math.floor(Math.random()*3)];
}
function next(){
  if(!G.queue.length){ end(); return; }
  G.lock=false; const w=G.queue[0]; G.cur=w; G.type=pickType();
  $("left").textContent=`осталось слов: ${G.queue.length}`;
  $("bar").style.width=(G.done/WORDS.length*100)+"%";
  const pool=shuffle(WORDS.filter(x=>x!==w));
  const same=pool.filter(x=>x.g===w.g), other=pool.filter(x=>x.g!==w.g);
  const opts=shuffle([w,...[...same,...other].slice(0,3)]);
  const showKo = G.type==="ru2ko";
  let p="";
  if(G.type==="ru2ko") p=`<div class="tag">Как по-корейски?</div><div class="q">${esc(w.ru)}</div>`;
  else if(G.type==="ko2ru") p=`<div class="tag">Что значит?</div><div class="q ko">${esc(w.ko)}</div>`;
  else p=`<div class="tag">Слушай и выбери перевод</div><button class="listen" onclick="say(G.cur.ko)" title="Повторить (пробел)">🔊</button>`;
  $("prompt").innerHTML=p;
  $("opts").innerHTML=opts.map((o,i)=>`<button data-i="${i}" class="${showKo?'ko':''}"><span class="k">${i+1}</span>${esc(showKo?o.ko:o.ru)}</button>`).join("");
  [...$("opts").children].forEach((b,i)=>b.onclick=()=>answer(b,opts[i]));
  if(G.type==="audio") setTimeout(()=>say(w.ko),150);
}
function answer(btn,o){
  if(!G||G.lock) return; G.lock=true; const w=G.cur;
  const btns=[...$("opts").children];
  if(o===w){
    btn.classList.add("ok"); G.right++; G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak);
    let add=10; if(G.streak>=3){ add+=5; popUp(`🔥 x${G.streak}  +15`); }
    G.pts+=add; G.queue.shift(); G.done++;
    if(G.type!=="audio") say(w.ko);
    setTimeout(next,550);
  } else {
    btn.classList.add("bad"); G.wrong++; G.streak=0;
    G.missed.set(w.ko,w);
    btns.forEach(b=>{ if(b.textContent.slice(1)===(G.type==="ru2ko"?w.ko:w.ru)) b.classList.add("ok"); });
    say(w.ko);
    G.queue.push(G.queue.shift());            // слово вернётся в конце
    setTimeout(next,1300);
  }
  $("pts").textContent=G.pts; $("combo").textContent=G.streak>=2?`🔥 x${G.streak}`:"";
}
function popUp(t){ const p=$("pop"); p.textContent=t; p.classList.remove("go"); void p.offsetWidth; p.classList.add("go"); }

function end(){
  if(!G||G.ended) return; G.ended=true; clearInterval(G.timer);
  const timeBonus = G.queue.length ? 0 : G.t*2;   // всё успел — бонус за оставшееся время
  G.pts+=timeBonus;
  $("gameCard").classList.add("hidden"); $("resCard").classList.remove("hidden");
  const acc = G.right+G.wrong ? Math.round(G.right/(G.right+G.wrong)*100) : 0;
  const stars = G.done===WORDS.length && acc>=90 ? 3 : G.done>=WORDS.length*0.7 && acc>=70 ? 2 : 1;
  $("stars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
  $("final").textContent=G.pts+" очков";
  let best=0; try{ best=+localStorage.getItem(bestKey())||0; if(G.pts>best) localStorage.setItem(bestKey(),G.pts); }catch(e){}
  $("resLine").textContent=`Слов: ${G.done}/${WORDS.length} · точность ${acc}% · лучшая серия ${G.bestStreak}`+(timeBonus?` · бонус за время +${timeBonus}`:"")+(G.pts>best&&best?" · 🏆 новый рекорд!":"");
  const miss=[...G.missed.values()], notDone=G.queue.filter(w=>!G.missed.has(w.ko));
  let h="";
  if(miss.length) h+=`<h3 style="margin:16px 0 4px">Повтори эти слова</h3><table class="res">`+miss.map(w=>`<tr><td class="ko" style="font-size:18px">${esc(w.ko)}</td><td>${esc(w.ru)}</td><td style="text-align:right"><button class="sm" onclick="say('${w.ko}')">🔊</button></td></tr>`).join("")+`</table>`;
  if(notDone.length) h+=`<p class="muted" style="margin:12px 0 2px">Не успел(а) дойти:</p><div class="chips ko">`+notDone.map(w=>`<span>${esc(w.ko)}</span>`).join("")+`</div>`;
  if(!miss.length && !notDone.length) h=`<p style="text-align:center">Все слова без ошибок — 완벽해요! 🎉</p>`;
  $("mistakes").innerHTML=h;
  sendReport(acc, miss, notDone);
}
async function sendReport(acc, miss, notDone){
  const modeName={mix:"смешанный",ru:"перевод → слово",audio:"на слух"}[G.mode];
  const text=`⚡ <b>Разминка 가전제품</b>\n👤 ${esc(G.name)} · режим: ${modeName}\n🕒 ${new Date().toLocaleString("ru-RU")}\n\nОчки: <b>${G.pts}</b> · слов ${G.done}/${WORDS.length} · точность ${acc}% · серия ${G.bestStreak}`+
    (miss.length?`\n❌ Ошибки: ${miss.map(w=>w.ko).join(", ")}`:"\n✅ Без ошибок")+
    (notDone.length?`\n⏳ Не дошёл(ла): ${notDone.map(w=>w.ko).join(", ")}`:"");
  $("sendFb").textContent="Отправляю учителю…"; $("sendFb").style.color="";
  try{ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text,parse_mode:"HTML"})});
    const j=await r.json(); if(!j.ok) throw new Error(j.description);
    $("sendFb").textContent="✅ Результат отправлен учителю"; }
  catch(e){ $("sendFb").textContent="Не получилось отправить результат — покажи экран учителю."; $("sendFb").style.color="var(--bad)"; }
}
function toStart(){ $("resCard").classList.add("hidden"); $("startCard").classList.remove("hidden"); showBest(); }

document.addEventListener("keydown",e=>{
  if(!G||G.ended||$("gameCard").classList.contains("hidden")) return;
  if(e.key>="1"&&e.key<="4"){ const b=$("opts").children[+e.key-1]; if(b) b.click(); }
  if(e.key===" "){ e.preventDefault(); say(G.cur.ko); }
});
</script>
</body>
</html>
