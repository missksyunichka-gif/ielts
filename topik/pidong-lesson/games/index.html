<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Игры со словами</title>
<style>
  :root{--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--bg:#f5f6fa;--card:#fff;--accent:#2f5bea;--ok:#1f9d55;--okbg:#e9f8ef;--bad:#d64545;--badbg:#fdeeee}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 80px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  header h1{font-size:20px;margin:0}
  .who{font-size:14px;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0000000d}
  h2{margin:0 0 6px;font-size:20px}
  h3{margin:4px 0 6px;font-size:17px}
  .muted{color:var(--muted);font-size:14px}
  .ielts{font-weight:700}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:#eef0f4;color:var(--ink);margin:4px 4px 4px 0}
  button.primary{background:var(--accent);color:#fff}
  button.dark{background:var(--ink);color:#fff}
  button.sm{font-size:14px;padding:6px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=text]{font:inherit;padding:9px 11px;border:1.5px solid #c9ced8;border-radius:9px;width:100%}
  input.gap{width:140px;padding:4px 8px;border:0;border-bottom:2px solid #8a93a6;border-radius:0;background:#fafbfc;text-align:center}
  input.ok{border-color:var(--ok)!important;background:var(--okbg)!important}
  input.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
  .fix{color:var(--ok);font-weight:700;font-size:14px;margin-left:6px}
  nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  nav button{margin:0;font-size:15px}
  nav button.active{background:var(--ink);color:#fff}
  nav .done::after{content:" ✓";color:var(--ok)}
  nav button.active.done::after{color:#8ff0b5}
  .sets{display:flex;flex-wrap:wrap;gap:6px}
  .sets button.active{background:var(--accent);color:#fff}
  .ex{display:flex;flex-wrap:wrap;gap:6px}
  .ex button{margin:0}
  .ex button.done{background:var(--okbg);outline:1.5px solid var(--ok)}
  .form{border:2px solid var(--ink);border-radius:6px;padding:14px 16px;background:#fff}
  .form .title{text-align:center;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .row .lab{min-width:210px;color:#344054}
  .qn{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border:1.5px solid var(--ink);border-radius:5px;font-size:13px;font-weight:700;margin-right:4px}
  .example{color:var(--muted);font-style:italic}
  .pk button.sel{background:#dfe6ff;outline:2px solid var(--accent)}
  .pk button.ok{background:var(--okbg);outline:2px solid var(--ok)}
  .pk button.bad{background:var(--badbg);outline:2px solid var(--bad)}
  label{display:block;margin-top:6px}
  details{margin:6px 0} summary{cursor:pointer;padding:4px 0}
  ul.pb{margin:4px 0 8px;padding-left:20px} ul.pb li{margin:3px 0}
  .score{font-size:18px;font-weight:700;margin-top:12px}
  .hidden{display:none!important}
  .transcript{background:#f3f6ff;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
  .transcript p{margin:4px 0}
  mark{background:#ffe58a;padding:0 2px;border-radius:3px}
  .reading{background:#fffdf5;border:1px solid #efe6c4;border-radius:10px;padding:14px 16px;font-family:Georgia,serif;font-size:16.5px}
  .reading h4{margin:0 0 6px;text-align:center;font-family:inherit;font-size:19px}
  .reading h5{margin:12px 0 2px;font-size:16px}
  .reading p{margin:4px 0}
  table.tbl{width:100%;border-collapse:collapse;font-size:15px}
  table.tbl th,table.tbl td{border:1px solid #9aa2b1;padding:7px;vertical-align:top;text-align:left}
  table.tbl th{background:#f1f3f7}
  table.tbl td div{margin:3px 0}
  .flash{perspective:900px;height:180px;margin:12px 0;cursor:pointer;user-select:none}
  .flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .flash.flip .in{transform:rotateY(180deg)}
  .flash .side{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;font-size:26px;font-weight:700;padding:12px;text-align:center}
  .flash .front{background:#eef3ff}
  .flash .back{background:#effaf3;transform:rotateY(180deg)}
  .flash small{font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .opts button{margin:0;padding:12px;text-align:left;background:#f1f3f7}
  .opts button.ok{background:var(--okbg);outline:2px solid var(--ok)}
  .opts button.bad{background:var(--badbg);outline:2px solid var(--bad)}
  .bar{height:8px;background:#e7e9ef;border-radius:5px;overflow:hidden;margin:8px 0}
  .bar div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .big{font-size:22px;font-weight:700;margin:10px 0}
  .feedback{min-height:24px;margin-top:8px;font-weight:600}
  table.res{width:100%;border-collapse:collapse;font-size:15px}
  table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .speed{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
  @media(max-width:560px){.opts{grid-template-columns:1fr}.row .lab{min-width:100%}table.tbl{font-size:14px}input.gap{width:110px}}
</style>

<style>
  .ko{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  .games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .games button{margin:0;padding:16px 10px;font-size:16px;background:#f1f3f7;text-align:center}
  .games button small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .src button.on{background:var(--ink);color:#fff}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .tiles button{margin:0;min-height:68px;padding:8px;font-size:16px;background:#eef3ff;transition:transform .15s}
  .tiles button.sel{outline:3px solid var(--accent)}
  .tiles button.gone{visibility:hidden}
  .tiles button.bad{background:var(--badbg)}
  .syl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .syl button{margin:0;font-size:24px;min-width:56px;padding:10px 14px}
  .slot{font-size:30px;min-height:48px;border-bottom:3px solid #c9ced8;margin:10px 0;letter-spacing:2px}
  .hud{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
  .shake{animation:sh .3s} @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .tf{display:flex;gap:10px;margin-top:14px} .tf button{flex:1;font-size:22px;padding:16px;margin:0}
</style>
</head>

<div class="wrap">
<div id="login" class="card">
  <h2>🎮 Игры со словами</h2>
  <p class="muted">Войди, чтобы играть со своими трудными словами. Без входа — игры на случайных словах.</p>
  <input type="text" id="nameInput" placeholder="Имя" autocomplete="off">
  <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="PIN" style="max-width:160px;margin-top:8px" onkeydown="if(event.key==='Enter')start()">
  <div class="feedback" id="loginFb" style="color:var(--bad)"></div>
  <button class="primary" onclick="start()">Войти →</button> <button onclick="start(true)">Играть без входа</button>
</div>
<div id="app" class="hidden">
  <div class="card" id="menu">
    <h2 style="margin-top:0">🎮 Игры со словами</h2>
    <p class="muted" style="margin-top:0">С какими словами играем?</p>
    <div class="ex src"><button id="srcWeak" onclick="setSrc('weak')">😰 Мои трудные слова</button><button id="srcRand" onclick="setSrc('rand')">🎲 Случайные слова</button></div>
    <p class="muted" id="srcInfo"></p>
    <div class="games">
      <button onclick="play('pairs')">🧩 Найди пару<small>корейское ↔ перевод</small></button>
      <button onclick="play('build')">🔤 Собери слово<small>из слогов</small></button>
      <button onclick="play('blitz')">⚡ Блиц 60 сек<small>успей больше</small></button>
      <button onclick="play('tf')">✅❌ Верно или нет<small>45 секунд</small></button>
    </div>
    <p><button class="primary" onclick="play()" style="width:100%;margin-top:8px">🎲 Случайная игра</button></p>
    <p class="muted" id="best"></p>
  </div>
  <div class="card hidden" id="game">
    <button class="sm" onclick="menu()">← Игры</button>
    <h3 id="gTitle"></h3>
    <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
    <div id="gBody"></div>
    <div class="feedback" id="gFb"></div>
  </div>
</div>
</div>

   {s:"아빠가 벽에 그림을 ( ).", o:["걸고 있어요","걸려 있어요"], a:"걸고 있어요", ru:"Папа вешает картину на стену.", why:"действие, 그림을 → -고 있다"},
   {s:"민수 씨는 지금 의자에 ( ).", o:["앉아 있어요","앉고 있어요"], a:"앉아 있어요", ru:"Минсу сейчас сидит на стуле.", why:"сел и сидит — состояние → -아 있다"},
   {s:"친구가 빨간 코트를 ( ).", o:["입고 있어요","입어 있어요"], a:"입고 있어요", ru:"Подруга одета в красное пальто.", why:"одежда всегда с -고 있다"},
   {s:"책상 위에 책이 ( ).", o:["놓여 있어요","놓고 있어요"], a:"놓여 있어요", ru:"На столе лежит книга.", why:"состояние → 놓이다 + -어 있다"},
   {s:"안경을 ( ) 사람이 우리 선생님이에요.", o:["쓰고 있는","써 있는"], a:"쓰고 있는", ru:"Человек в очках — наш учитель.", why:"очки, как одежда → -고 있다"},
   {s:"칠판에 이름이 ( ).", o:["쓰여 있어요","쓰고 있어요"], a:"쓰여 있어요", ru:"На доске написано имя.", why:"состояние → 쓰이다 + -어 있다"},
   {s:"학생들이 교실에서 시험을 ( ).", o:["보고 있어요","봐 있어요"], a:"보고 있어요", ru:"Студенты пишут экзамен в классе.", why:"действие сейчас → -고 있다"},
   {s:"공원에 사람들이 많이 ( ).", o:["모여 있어요","모으고 있어요"], a:"모여 있어요", ru:"В парке собралось много людей.", why:"собрались и находятся там → 모이다 + -어 있다"},
   {s:"지하철에서 사람들이 다 ( ).", o:["서 있어요","서고 있어요"], a:"서 있어요", ru:"В метро все стоят.", why:"встали и стоят → 서다 + -어 있다"}],
  wr:[
   {q:"열리다 + -아/어 있다", a:"열려 있다", ru:"быть открытым"},
   {q:"앉다 + -아/어 있다", a:"앉아 있다", ru:"сидеть"},
   {q:"입다 + -고 있다", a:"입고 있다", ru:"быть одетым"},
   {q:"놓이다 + -아/어 있다", a:"놓여 있다", ru:"лежать (о предмете)"},
   {q:"서다 + -아/어 있다", a:"서 있다", ru:"стоять"},
   {q:"걸리다 + -아/어 있다", a:"걸려 있다", ru:"висеть"},
   {q:"쓰다 (очки) + -고 있다", a:"쓰고 있다", ru:"быть в очках"},
   {q:"켜지다 + -아/어 있다", a:"켜져 있다", ru:"быть включённым"}]},
 {id:"G2", gram:true, name:"Грамматика 2 · глагол + -아/어지다", words:[],
  rule:`<b>Глагол + -아/어지다</b> — ещё один способ сделать пассив, когда у глагола нет суффикса 이/히/리/기.<br>
  켜다 → <b>켜지다</b> (включаться), 끄다 → <b>꺼지다</b> (гаснуть), 만들다 → <b>만들어지다</b>, 지우다 → <b>지워지다</b>, 정하다 → <b>정해지다</b>, 알리다 → <b>알려지다</b>, 이루다 → <b>이루어지다</b>.<br><br>
  💡 Кто-то делает → актив: 제가 불을 <b>껐어요</b>. Происходит само / неважно кто → пассив: 불이 <b>꺼졌어요</b>.<br>
  ⚠️ С прилагательными -아/어지다 значит «становиться»: 예쁘다 → 예뻐지다 (становиться красивее).`,
  items:[
   {s:"갑자기 컴퓨터가 ( ).", o:["꺼졌어요","껐어요"], a:"꺼졌어요", ru:"Компьютер внезапно выключился.", why:"само выключилось → 꺼지다"},
   {s:"제가 나갈 때 불을 ( ).", o:["껐어요","꺼졌어요"], a:"껐어요", ru:"Уходя, я выключил свет.", why:"я выключил, 불을 → актив"},
   {s:"이 가방은 가죽으로 ( ).", o:["만들어졌어요","만들었어요"], a:"만들어졌어요", ru:"Эта сумка сделана из кожи.", why:"сумка сделана → пассив"},
   {s:"실수로 파일이 ( ).", o:["지워졌어요","지웠어요"], a:"지워졌어요", ru:"Файл случайно удалился.", why:"файл удалился → 지워지다"},
   {s:"사람이 들어오면 불이 자동으로 ( ).", o:["켜져요","켜요"], a:"켜져요", ru:"Когда кто-то входит, свет включается сам.", why:"само включается → 켜지다"},
   {s:"드디어 제 꿈이 ( ).", o:["이루어졌어요","이뤘어요"], a:"이루어졌어요", ru:"Наконец моя мечта сбылась.", why:"мечта сбылась → 이루어지다"},
   {s:"회의 시간이 3시로 ( ).", o:["정해졌어요","정했어요"], a:"정해졌어요", ru:"Время встречи назначено на 3 часа.", why:"время назначено → 정해지다"},
   {s:"이 노래는 전 세계에 ( ).", o:["알려졌어요","알렸어요"], a:"알려졌어요", ru:"Эта песня стала известна во всём мире.", why:"стала известной → 알려지다"},
   {s:"이건 제가 직접 ( ) 케이크예요.", o:["만든","만들어진"], a:"만든", ru:"Это торт, который я испёк сам.", why:"я сделал (제가) → актив 만들다"},
   {s:"운동을 해서 건강이 ( ).", o:["좋아졌어요","좋았어요"], a:"좋아졌어요", ru:"Благодаря спорту здоровье стало лучше.", why:"прилагательное + -아지다 = «стать»"}],
  wr:[
   {q:"켜다 → пассив", a:"켜지다", ru:"включаться"},
   {q:"끄다 → пассив", a:"꺼지다", ru:"выключаться, гаснуть"},
   {q:"만들다 → пассив", a:"만들어지다", ru:"изготавливаться"},
   {q:"지우다 → пассив", a:"지워지다", ru:"стираться, удаляться"},
   {q:"정하다 → пассив", a:"정해지다", ru:"определяться"},
   {q:"알리다 → пассив", a:"알려지다", ru:"становиться известным"},
   {q:"이루다 → пассив", a:"이루어지다", ru:"сбываться"},
   {q:"좋다 + -아/어지다", a:"좋아지다", ru:"становиться лучше"}]}
];

const SETS=[...SETS_L,...SETS_P.filter(s=>s.pas)];


const $=id=>document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
async function rpc(fn,args){ const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  const t=await r.text(); if(!r.ok){ let m=t; try{m=JSON.parse(t).message}catch(e){} throw new Error(m); } return t?JSON.parse(t):null; }
let voices=[]; function loadVoices(){ voices=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); let s=null; try{s=localStorage.getItem("topik_voice")}catch(e){} const k=voices.findIndex(v=>v.name===s); if(k>0) voices.unshift(voices.splice(k,1)[0]); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function say(t){ if(!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voices[0]){u.voice=voices[0];u.lang=voices[0].lang;} else u.lang="ko-KR"; u.rate=0.85; speechSynthesis.speak(u); }

/* ---------- слова ---------- */
const ALL=[]; const seenKo=new Set(); const WORDS_LABEL="слова урока, 피동 и программа 서울대+";
(typeof LESSONS!=="undefined"?LESSONS:[]).forEach(l=>l.words.forEach(w=>{ if(!seenKo.has(w.ko)){ seenKo.add(w.ko); ALL.push({ko:w.ko,ru:w.ru,key:l.id+"|"+w.ko,src:l.name}); } }));
SETS.forEach(s=>s.words.forEach(w=>{ if(!seenKo.has(w.ko)){ seenKo.add(w.ko); ALL.push({ko:w.ko,ru:w.ru,key:"lesson|"+w.ko,src:"текущий урок"}); } }));
let NAME="", WEAK=[], SRC="rand";
function weakFrom(prog,les){ const out=new Set();
  if(prog&&prog.words) Object.entries(prog.words).forEach(([k,s])=>{ if(s.wr===0||s.tr===0) out.add(k.split("|")[1]); });
  (les||[]).forEach(s=>s&&s.vocab&&Object.values(s.vocab).forEach(v=>(v.mistakes||[]).forEach(m=>out.add(m.split(" (")[0]))));
  return ALL.filter(w=>out.has(w.ko)); }
async function start(anon){
  const n=$("nameInput").value.trim(), pin=$("pinInput").value.trim();
  let prog=null, les=null;
  if(!anon){ if(!n){ $("nameInput").focus(); return; } NAME=n;
    try{ const a=JSON.parse(localStorage.getItem(PROGRAM_KEY)); if(a&&a.name&&a.name.toLowerCase()===n.toLowerCase()) prog=a; }catch(e){}
    les=[]; SET_KEYS.forEach(k=>{ try{ const b=JSON.parse(localStorage.getItem(k)); if(b&&b.name&&b.name.toLowerCase()===n.toLowerCase()) les.push(b); }catch(e){} });
    if(SB_ON&&/^\d{4,8}$/.test(pin)){ $("loginFb").style.color="var(--muted)"; $("loginFb").textContent="Загружаю слова…";
      try{ if(PROGRAM_KEY) prog=await rpc("load_progress",{p_site:PROGRAM_KEY,p_name:n,p_pin:pin})||prog;
        const got=[]; for(const k of SET_KEYS){ const s=await rpc("load_progress",{p_site:k,p_name:n,p_pin:pin}); if(s) got.push(s); } if(got.length) les=got; }
      catch(e){ if(/wrong_pin/.test(e.message)){ $("loginFb").style.color="var(--bad)"; $("loginFb").textContent="Неверный PIN для этого имени."; return; } } } }
  WEAK=weakFrom(prog,les); SRC=WEAK.length?"weak":"rand";
  $("login").classList.add("hidden"); $("app").classList.remove("hidden"); menu(); }
function setSrc(s){ SRC=s; menu(); }
function pool(n){ let p=SRC==="weak"?shuffle(WEAK):[]; if(p.length<n) p=p.concat(shuffle(ALL.filter(w=>!p.includes(w)))).slice(0,Math.max(n,p.length)); return shuffle(p).slice(0,n); }
function best(g){ try{return +localStorage.getItem("games_best_"+g)||0}catch(e){return 0} }
function setBest(g,v){ if(v>best(g)) try{localStorage.setItem("games_best_"+g,v)}catch(e){} }
function menu(){ stopTimer(); $("game").classList.add("hidden"); $("menu").classList.remove("hidden");
  $("srcWeak").classList.toggle("on",SRC==="weak"); $("srcRand").classList.toggle("on",SRC==="rand");
  $("srcInfo").textContent=SRC==="weak"?(WEAK.length?"Трудных слов: "+WEAK.length+" — это слова, в которых были ошибки в тренажёрах."+(WEAK.length<6?" Их мало, добавлю немного случайных.":""):"Трудных слов пока нет 🎉 Буду брать случайные."):"Случайные слова: "+WORDS_LABEL+" ("+ALL.length+").";
  $("best").textContent="Рекорды: ⚡ Блиц — "+best("blitz")+" · ✅❌ Верно или нет — "+best("tf"); }

/* ---------- общий каркас ---------- */
let T=null;
function stopTimer(){ if(T){ clearInterval(T); T=null; } }
function timer(sec,onTick,onEnd){ stopTimer(); let left=sec; onTick(left); T=setInterval(()=>{ left--; onTick(left); if(left<=0){ stopTimer(); onEnd(); } },1000); }
function gOpen(title){ $("menu").classList.add("hidden"); $("game").classList.remove("hidden"); $("gTitle").textContent=title; $("gFb").textContent=""; $("hudL").textContent=""; $("hudR").textContent=""; }
function play(g){ g=g||shuffle(["pairs","build","blitz","tf"])[0]; ({pairs,build,blitz,tf})[g](); }
function endScreen(html,again){ stopTimer(); $("gBody").innerHTML='<div class="big" style="text-align:center">'+html+'</div><p style="text-align:center"><button class="primary" onclick="'+again+'()">Ещё раз</button> <button onclick="play()">🎲 Другая игра</button></p>'; }

/* 🧩 Найди пару */
function pairs(){ gOpen("🧩 Найди пару"); const ws=pool(6); let sel=null, left=ws.length, moves=0; const t0=Date.now();
  const tiles=shuffle(ws.flatMap((w,i)=>[{i,t:w.ko,ko:true},{i,t:w.ru}]));
  $("gBody").innerHTML='<p class="muted">Найди слово и его перевод.</p><div class="tiles">'+tiles.map((x,k)=>'<button data-k="'+k+'" class="'+(x.ko?"ko":"")+'">'+esc(x.t)+'</button>').join("")+'</div>';
  $("hudL").textContent="Пар: 0/"+ws.length;
  $("gBody").querySelectorAll(".tiles button").forEach(b=>b.onclick=()=>{ const x=tiles[+b.dataset.k]; if(x.ko) say(x.t);
    if(!sel){ sel=b; b.classList.add("sel"); return; } if(sel===b){ b.classList.remove("sel"); sel=null; return; }
    moves++; const y=tiles[+sel.dataset.k];
    if(y.i===x.i&&y.ko!==x.ko){ [sel,b].forEach(e=>e.classList.add("gone")); left--; $("hudL").textContent="Пар: "+(ws.length-left)+"/"+ws.length; $("gFb").innerHTML='👍 <span class="ko">'+esc(ws[x.i].ko)+'</span> — '+esc(ws[x.i].ru);
      if(!left) setTimeout(()=>endScreen("🎉 Все пары за "+Math.round((Date.now()-t0)/1000)+" сек<br><span class='muted' style='font-size:16px'>ходов: "+moves+"</span>","pairs"),600); }
    else { [sel,b].forEach(e=>{ e.classList.add("bad","shake"); setTimeout(()=>e.classList.remove("bad","shake"),400); }); }
    sel.classList.remove("sel"); sel=null; }); }

/* 🔤 Собери слово */
function build(){ gOpen("🔤 Собери слово"); const ws=pool(30).filter(w=>w.ko.replace(/\s/g,"").length>=2).slice(0,8); let i=0, ok=0;
  function round(){ if(i>=ws.length) return endScreen("🎉 Собрано: "+ok+" из "+ws.length,"build");
    const w=ws[i], target=[...w.ko.replace(/\s/g,"")], decoy=shuffle(ALL.filter(x=>x!==w).flatMap(x=>[...x.ko.replace(/\s/g,"")]).filter(c=>!target.includes(c))).slice(0,2);
    let got=[], miss=false; const pieces=shuffle(target.concat(decoy).map((c,k)=>({c,k})));
    $("hudL").textContent="Слово "+(i+1)+"/"+ws.length; $("hudR").textContent="✓ "+ok;
    $("gBody").innerHTML='<div class="big">'+esc(w.ru)+'</div><div class="slot ko" id="slot"></div><div class="syl" id="syl">'+pieces.map((p,k)=>'<button class="ko" data-k="'+k+'">'+esc(p.c)+'</button>').join("")+'</div><p><button class="sm" id="bs">⌫ Стереть</button> <button class="sm" id="hint">💡 Подсказка</button></p>';
    const draw=()=>{ $("slot").textContent=got.map(k=>pieces[k].c).join(""); $("syl").querySelectorAll("button").forEach(b=>b.disabled=got.includes(+b.dataset.k)); };
    $("syl").querySelectorAll("button").forEach(b=>b.onclick=()=>{ got.push(+b.dataset.k); draw();
      if(got.length===target.length){ const s=got.map(k=>pieces[k].c).join("");
        if(s===target.join("")){ if(!miss) ok++; $("gFb").innerHTML='👍 <span class="ko">'+esc(w.ko)+'</span>'; say(w.ko); i++; setTimeout(round,1000); }
        else { miss=true; $("slot").classList.add("shake"); $("gFb").textContent="Не то — попробуй ещё."; setTimeout(()=>{ $("slot").classList.remove("shake"); got=[]; draw(); },500); } } });
    $("bs").onclick=()=>{ got.pop(); draw(); };
    $("hint").onclick=()=>{ miss=true; $("gFb").innerHTML='Начинается на <b class="ko">'+esc(target[0])+'</b>'; };
    $("gFb").textContent=""; draw(); }
  round(); }

/* ⚡ Блиц */
function blitz(){ gOpen("⚡ Блиц 60 секунд"); let score=0, errs=0;
  function q(){ const [w]=pool(1); const opts=shuffle([w.ru,...shuffle(ALL.filter(x=>x.ru!==w.ru&&x.ko!==w.ko)).slice(0,3).map(x=>x.ru)]);
    $("gBody").innerHTML='<div class="big ko" style="font-size:30px">'+esc(w.ko)+'</div><div class="opts">'+opts.map(o=>'<button>'+esc(o)+'</button>').join("")+'</div>';
    $("gBody").querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{ const good=b.textContent===w.ru; if(good) score++; else errs++; b.classList.add(good?"ok":"bad");
      $("hudR").textContent="✓ "+score+"  ✗ "+errs; $("gFb").innerHTML=good?"":'<span class="ko">'+esc(w.ko)+'</span> — '+esc(w.ru); setTimeout(()=>{ if(T) q(); },good?250:900); }); }
  $("hudR").textContent="✓ 0  ✗ 0";
  timer(60,l=>$("hudL").textContent="⏱ "+l,()=>{ setBest("blitz",score); endScreen("⏰ Время!<br>Правильно: "+score+(errs?"<br><span class='muted' style='font-size:16px'>ошибок: "+errs+"</span>":"")+"<br><span class='muted' style='font-size:16px'>рекорд: "+best("blitz")+"</span>","blitz"); });
  q(); }

/* ✅❌ Верно или нет */
function tf(){ gOpen("✅❌ Верно или нет"); let score=0, errs=0;
  function q(){ const [w]=pool(1); const truth=Math.random()<0.5; const ru=truth?w.ru:shuffle(ALL.filter(x=>x.ru!==w.ru))[0].ru;
    $("gBody").innerHTML='<div class="big ko" style="font-size:30px">'+esc(w.ko)+'</div><div class="big" style="font-weight:500">= '+esc(ru)+' ?</div><div class="tf"><button id="yes" style="background:var(--okbg)">✅ Верно</button><button id="no" style="background:var(--badbg)">❌ Нет</button></div>';
    const ans=v=>{ const good=v===truth; if(good) score++; else errs++; $("hudR").textContent="✓ "+score+"  ✗ "+errs;
      $("gFb").innerHTML=good?"👍":'✗ <span class="ko">'+esc(w.ko)+'</span> — '+esc(w.ru); setTimeout(()=>{ if(T) q(); },good?300:1100); };
    $("yes").onclick=()=>ans(true); $("no").onclick=()=>ans(false); }
  $("hudR").textContent="✓ 0  ✗ 0";
  timer(45,l=>$("hudL").textContent="⏱ "+l,()=>{ setBest("tf",score); endScreen("⏰ Время!<br>Правильно: "+score+"<br><span class='muted' style='font-size:16px'>рекорд: "+best("tf")+"</span>","tf"); });
  q(); }

/* автовход из страницы с вкладками */
(function(){ const m=location.hash.match(/^#auto=(.+)$/); if(!m) return;
  try{ const a=JSON.parse(decodeURIComponent(escape(atob(m[1])))); history.replaceState(null,"",location.pathname+location.search);
    $("nameInput").value=a.n; $("pinInput").value=a.p; setTimeout(()=>start(),50); }catch(e){} })();
</script>
