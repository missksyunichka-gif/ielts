<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>사고와 사건 · быстрые задания</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--muted:#6b7280;--accent:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--sel:#ffedd5;--line:#e5e1d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:24px;margin:6px 0 4px} h2{font-size:20px;margin:0 0 4px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:11px 12px}
.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;width:100%;margin-top:12px}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:9px}
.task .n{width:34px;height:34px;border-radius:50%;background:var(--sel);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.task.done .n{background:var(--okbg);color:var(--ok)}
.task .t{flex:1} .task .r{font-size:14px;color:var(--muted);white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:8px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.col{display:grid;gap:8px;align-content:start}
.it{text-align:left;min-height:48px;font-size:15px;transition:all .15s}
.it.ko{font-size:18px}
.it.sel{background:var(--sel);border-color:var(--accent)}
.it.bad{background:var(--badbg);border-color:var(--bad)}
.it.gone{opacity:.25;pointer-events:none;background:var(--okbg);border-color:var(--ok)}
.word{font-size:30px;font-weight:700;text-align:center;margin:18px 0 6px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats button{text-align:center}
.cats button.ok{background:var(--okbg);border-color:var(--ok)}
.cats button.bad{background:var(--badbg);border-color:var(--bad)}
.q{font-size:21px;font-weight:600;margin:10px 0 4px}
.gap{border-bottom:2px solid var(--accent);padding:0 18px}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{text-align:left}
.opts button.ok{background:var(--okbg);border-color:var(--ok)}
.opts button.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;background:#faf8f3;border:1px solid var(--line);font-size:15px}
.big{font-size:42px;font-weight:700;margin:4px 0}
.mist{border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.mist b{font-size:17px}
.say{border:none;background:none;padding:0 4px;font-size:18px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="menu">
  <h1>사고와 사건 · быстрые задания</h1>
  <div class="muted">4 задания подряд, около 20 минут, все 109 слов. В конце результат уйдёт учителю.</div>
  <div class="card" id="taskList"></div>
  <div class="card">
    <div>Как тебя зовут?</div>
    <input id="nameInput" placeholder="Имя" autocomplete="off" style="font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px" onkeydown="if(event.key==='Enter')begin()">
    <button class="main" onclick="begin()">Начать →</button>
  </div>
</div>

<div id="final" class="hidden">
  <div class="card" id="summary"></div>
  <div class="card">
    <b>📨 Учителю</b>
    <div id="sendFb" class="muted" style="margin-top:6px"></div>
    <button class="main" id="sendBtn" onclick="sendResults()">Отправить ещё раз</button>
    <textarea id="copyBox" class="hidden" readonly style="width:100%;height:170px;font:13px monospace;margin-top:8px"></textarea>
    <button class="hidden" id="copyBtn" style="width:100%;margin-top:8px" onclick="copyReport()">Скопировать текст</button>
  </div>
  <button style="width:100%;margin-top:12px" onclick="location.reload()">Пройти заново</button>
</div>

<div id="play" class="hidden">
  <div class="top"><span id="tInfo" style="font-weight:600;color:var(--accent)"></span><span id="pInfo"></span><span id="clock"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="stage"></div>
</div>

</div>

function buildReport(){
  const ok=TASKS.reduce((a,t)=>a+RES[t.id].ok,0), tot=TASKS.reduce((a,t)=>a+RES[t.id].total,0);
  const d=new Date(), dt=d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  let t=`🧩 <b>사고와 사건 · быстрые задания</b>\n👤 ${esc(NAME)}\n📅 ${dt}\n\n✅ <b>${ok}/${tot} (${Math.round(ok/tot*100)}%)</b> · ⏱ ${fmt(Date.now()-T_START)}\n`;
  TASKS.forEach((x,i)=>{ const r=RES[x.id]; t+=`${i+1}. ${x.name}: ${r.ok}/${r.total} · ${fmt(r.time)}\n`; });
  const mist=TASKS.flatMap(x=>RES[x.id].mist);
  t+= mist.length? `\n❌ <b>Ошибки (${mist.length}):</b>\n`+mist.map(m=>`• ${esc(m.ko)} — ${esc(m.ru)}`).join("\n") : "\nБез ошибок 🎉";
  return t;
}
let REPORT="";
async function sendResults(){
  REPORT=buildReport(); const fb=$("sendFb"), btn=$("sendBtn"); btn.disabled=true; fb.textContent="Отправляю учителю…";
  try{
    if(!TG_TOKEN || TG_TOKEN.indexOf("TOKEN")>=0) throw new Error("отправка здесь недоступна");
    const parts=[]; let rest=REPORT; while(rest.length){ let cut=rest.length>3800?rest.lastIndexOf("\n",3800):rest.length; if(cut<=0) cut=3800; parts.push(rest.slice(0,cut)); rest=rest.slice(cut); }
    for(const p of parts){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:p,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description||"ошибка"); }
    fb.textContent="✅ Отправлено учителю! 잘했어요!"; btn.textContent="Отправить ещё раз";
  }catch(e){
    fb.textContent="Не получилось отправить ("+e.message+"). Скопируй текст и отправь учителю вручную:";
    const b=$("copyBox"); b.value=REPORT.replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/&quot;/g,'"'); b.classList.remove("hidden"); $("copyBtn").classList.remove("hidden");
  }
  btn.disabled=false;
}
function copyReport(){ const b=$("copyBox"); b.select(); try{ navigator.clipboard.writeText(b.value).then(()=>$("copyBtn").textContent="Скопировано ✓",()=>document.execCommand("copy")); }catch(e){ document.execCommand("copy"); } }

/* ---------- 1 и 2: пары ---------- */
let ROUNDS=[], ri=0, picked=null, left=0;
function startPairs(){
  const ws=shuffle(ALL); ROUNDS=[];
  for(let i=0;i<ws.length;i+=8) ROUNDS.push(ws.slice(i,i+8).map(w=>({l:w.ko,r:w.ru,w})));
  // хвост: если в последнем раунде мало слов — сливаем с предыдущим
  if(ROUNDS.length>1 && ROUNDS.at(-1).length<5){ const t=ROUNDS.pop(); ROUNDS[ROUNDS.length-1]=ROUNDS.at(-1).concat(t); }
  cur.total=ALL.length; ri=0; drawRound("Пары", true);
}
function startCollo(){
  const ps=shuffle(COLLO); ROUNDS=[ps.slice(0,8),ps.slice(8)].map(r=>r.map(([a,b])=>({l:a,r:b,w:{ko:a+" "+b,ru:(BY[a+" "+b]||{}).ru||""}})));
  cur.total=COLLO.length; ri=0; drawRound("Что с чем", false);
}
let pTitle="", pLeftKo=true;
function drawRound(title, leftKo){
  if(title){pTitle=title; pLeftKo=leftKo;}
  const R=ROUNDS[ri]; left=R.length; picked=null;
  $("pInfo").textContent=`${pTitle} · ${ri+1}/${ROUNDS.length}`;
  $("prog").style.width=(ri/ROUNDS.length*100)+"%";
  const L=shuffle(R.map((p,k)=>({k,t:p.l}))), Rr=shuffle(R.map((p,k)=>({k,t:p.r})));
  $("stage").innerHTML=`<div class="muted">${pLeftKo?"Найди пары: слово — перевод. Нажми на корейское слово, чтобы услышать.":"Собери выражения: что с чем сочетается."}</div>
   <div class="cols"><div class="col">${L.map(x=>`<button class="it ko" data-s="L" data-k="${x.k}" onclick="pick(this)">${esc(x.t)}</button>`).join("")}</div>
   <div class="col">${Rr.map(x=>`<button class="it ${pLeftKo?"":"ko"}" data-s="R" data-k="${x.k}" onclick="pick(this)">${esc(x.t)}</button>`).join("")}</div></div>`;
}
function pick(b){
  if(b.dataset.s==="L") say(b.textContent);
  if(!picked || picked.dataset.s===b.dataset.s){ if(picked) picked.classList.remove("sel"); picked=b; b.classList.add("sel"); return; }
  const a=picked; picked=null; a.classList.remove("sel");
  if(a.dataset.k===b.dataset.k){
    a.classList.add("gone"); b.classList.add("gone"); left--;
    if(!left) setTimeout(()=>{ ri++; ri<ROUNDS.length?drawRound():finishTask(); },350);
  } else {
    const Lb=a.dataset.s==="L"?a:b, p=ROUNDS[ri][+Lb.dataset.k];
    miss(p.l, {ko:p.w.ko, ru:p.w.ru||p.r, ex:p.w.ex});
    [a,b].forEach(x=>{x.classList.add("bad"); setTimeout(()=>x.classList.remove("bad"),450);});
  }
}

/* ---------- 3: группы ---------- */
let SQ=[], si=0, sLock=false;
function startSort(){ SQ=shuffle(SORT); si=0; cur.total=SQ.length; drawSort(); }
function drawSort(){
  sLock=false; const [ko]=SQ[si];
  $("pInfo").textContent=`Группы · ${si+1}/${SQ.length}`; $("prog").style.width=(si/SQ.length*100)+"%";
  $("stage").innerHTML=`<div class="muted">К какой группе относится слово?</div><div class="word">${esc(ko)} ${sayBtn(ko)}</div>
   <div class="cats">${CATS.map((c,k)=>`<button onclick="sortPick(${k},this)">${c}</button>`).join("")}</div><div id="sFb"></div>`;
}
function sortPick(k,b){
  if(sLock) return; const [ko,c]=SQ[si], w=BY[ko];
  if(k===c){ sLock=true; b.classList.add("ok"); setTimeout(()=>{ si++; si<SQ.length?drawSort():finishTask(); },400); }
  else { b.classList.add("bad"); miss(ko,{ko,ru:w.ru,ex:w.ex}); $("sFb").innerHTML=`<div class="fb"><b>${esc(ko)}</b> — ${esc(w.ru)}</div>`; }
}

/* ---------- 4: похожие слова ---------- */
let CQ=[], ci=0, cLock=false;
function startConf(){ CQ=shuffle(CONF).map(c=>({...c,opts:shuffle([c.a,...c.d])})); ci=0; cur.total=CQ.length; drawConf(); }
function drawConf(){
  cLock=false; const c=CQ[ci];
  $("pInfo").textContent=`Похожие · ${ci+1}/${CQ.length}`; $("prog").style.width=(ci/CQ.length*100)+"%";
  $("stage").innerHTML=`<div class="q">${esc(c.s).replace("____",'<span class="gap">&nbsp;</span>')}</div><div class="muted">${esc(c.h)}</div>
   <div class="opts">${c.opts.map((o,k)=>`<button onclick="confPick(${k},this)">${esc(o)}</button>`).join("")}</div><div id="cFb"></div>`;
}
function confPick(k,b){
  if(cLock) return; cLock=true; const c=CQ[ci], ok=c.opts[k]===c.a;
  document.querySelectorAll(".opts button").forEach((x,j)=>{ if(c.opts[j]===c.a) x.classList.add("ok"); else if(j===k) x.classList.add("bad"); });
  const full=c.plain?c.a:c.s.replace("____",c.a);
  if(ok){ setTimeout(nextConf,500); return; }
  miss(ci,{ko:c.plain?c.s:full, ru:c.n});
  $("cFb").innerHTML=`<div class="fb">${esc(full)} ${c.plain?"":sayBtn(full)}<div class="muted">${esc(c.n)}</div></div><button class="main" onclick="nextConf()">Дальше →</button>`;
}
function nextConf(){ ci++; ci<CQ.length?drawConf():finishTask(); }

</script>
