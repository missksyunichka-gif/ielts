<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверочная · 어휘 테스트</title>
<style>
  :root{--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--bg:#f5f6fa;--card:#fff;--accent:#2f5bea;--ok:#1f9d55;--okbg:#e9f8ef;--bad:#d64545;--badbg:#fdeeee}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 80px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  header h1{font-size:20px;margin:0}
  .who{font-size:14px;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0000000d}
  h2{margin:0 0 6px;font-size:20px}
  h3{margin:4px 0 6px;font-size:17px}
  .muted{color:var(--muted);font-size:14px}
  .ielts{font-weight:700}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:#eef0f4;color:var(--ink);margin:4px 4px 4px 0}
  button.primary{background:var(--accent);color:#fff}
  button.dark{background:var(--ink);color:#fff}
  button.sm{font-size:14px;padding:6px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=text]{font:inherit;padding:9px 11px;border:1.5px solid #c9ced8;border-radius:9px;width:100%}
  input.gap{width:140px;padding:4px 8px;border:0;border-bottom:2px solid #8a93a6;border-radius:0;background:#fafbfc;text-align:center}
  input.ok{border-color:var(--ok)!important;background:var(--okbg)!important}
  input.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
  .fix{color:var(--ok);font-weight:700;font-size:14px;margin-left:6px}
  nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  nav button{margin:0;font-size:15px}
  nav button.active{background:var(--ink);color:#fff}
  nav .done::after{content:" ✓";color:var(--ok)}
  nav button.active.done::after{color:#8ff0b5}
  .sets{display:flex;flex-wrap:wrap;gap:6px}
  .sets button.active{background:var(--accent);color:#fff}
  .ex{display:flex;flex-wrap:wrap;gap:6px}
  .ex button{margin:0}
  .ex button.done{background:var(--okbg);outline:1.5px solid var(--ok)}
  .form{border:2px solid var(--ink);border-radius:6px;padding:14px 16px;background:#fff}
  .form .title{text-align:center;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .row .lab{min-width:210px;color:#344054}
  .qn{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border:1.5px solid var(--ink);border-radius:5px;font-size:13px;font-weight:700;margin-right:4px}
  .example{color:var(--muted);font-style:italic}
  .pk button.sel{background:#dfe6ff;outline:2px solid var(--accent)}
  .pk button.ok{background:var(--okbg);outline:2px solid var(--ok)}
  .pk button.bad{background:var(--badbg);outline:2px solid var(--bad)}
  label{display:block;margin-top:6px}
  details{margin:6px 0} summary{cursor:pointer;padding:4px 0}
  ul.pb{margin:4px 0 8px;padding-left:20px} ul.pb li{margin:3px 0}
  .score{font-size:18px;font-weight:700;margin-top:12px}
  .hidden{display:none!important}
  .transcript{background:#f3f6ff;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
  .transcript p{margin:4px 0}
  mark{background:#ffe58a;padding:0 2px;border-radius:3px}
  .reading{background:#fffdf5;border:1px solid #efe6c4;border-radius:10px;padding:14px 16px;font-family:Georgia,serif;font-size:16.5px}
  .reading h4{margin:0 0 6px;text-align:center;font-family:inherit;font-size:19px}
  .reading h5{margin:12px 0 2px;font-size:16px}
  .reading p{margin:4px 0}
  table.tbl{width:100%;border-collapse:collapse;font-size:15px}
  table.tbl th,table.tbl td{border:1px solid #9aa2b1;padding:7px;vertical-align:top;text-align:left}
  table.tbl th{background:#f1f3f7}
  table.tbl td div{margin:3px 0}
  .flash{perspective:900px;height:180px;margin:12px 0;cursor:pointer;user-select:none}
  .flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
  .flash.flip .in{transform:rotateY(180deg)}
  .flash .side{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;font-size:26px;font-weight:700;padding:12px;text-align:center}
  .flash .front{background:#eef3ff}
  .flash .back{background:#effaf3;transform:rotateY(180deg)}
  .flash small{font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .opts button{margin:0;padding:12px;text-align:left;background:#f1f3f7}
  .opts button.ok{background:var(--okbg);outline:2px solid var(--ok)}
  .opts button.bad{background:var(--badbg);outline:2px solid var(--bad)}
  .bar{height:8px;background:#e7e9ef;border-radius:5px;overflow:hidden;margin:8px 0}
  .bar div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .big{font-size:22px;font-weight:700;margin:10px 0}
  .feedback{min-height:24px;margin-top:8px;font-weight:600}
  table.res{width:100%;border-collapse:collapse;font-size:15px}
  table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .speed{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
  @media(max-width:560px){.opts{grid-template-columns:1fr}.row .lab{min-width:100%}table.tbl{font-size:14px}input.gap{width:110px}}
</style>

<style>
  .ko{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  .timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer.low{color:var(--bad)}
  .opts button.sel{background:#dfe6ff;outline:2px solid var(--accent)}
  table.res td{vertical-align:top}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
  <h2>📝 어휘 테스트 · проверочная</h2>
  <p class="muted">20 вопросов, 5 минут. Ответы не исправляются, назад вернуться нельзя. Когда закончишь, нажми «Отправить».</p>
  <p class="muted">⌨️ Для последних вопросов нужна корейская раскладка.</p>
  <p>Как тебя зовут?</p>
  <input type="text" id="nameInput" placeholder="Имя и фамилия" autocomplete="off" onkeydown="if(event.key==='Enter')start()">
  <p><button class="primary" onclick="start()">Начать тест →</button></p>
</div>
<div id="app" class="hidden">
  <header><h1>어휘 테스트</h1><div class="who">👤 <span id="who"></span> · <span class="timer" id="timer">5:00</span></div></header>
  <div class="card" id="qCard">
    <div class="bar"><div id="bar"></div></div>
    <div class="muted" id="qNum"></div>
    <div class="muted" id="qTask" style="margin-top:4px"></div>
    <div class="big" id="qPrompt"></div>
    <div class="opts" id="qOpts"></div>
    <div id="qWrite" class="hidden">
      <input type="text" id="qIn" class="ko" lang="ko" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter'&&!event.isComposing)answerWrite()">
    </div>
    <p><button class="primary" id="nextBtn" onclick="next()" disabled>Ответить →</button></p>
  </div>
  <div class="card hidden" id="doneCard">
    <h2 id="doneTitle">Тест закончен</h2>
    <p class="muted" id="doneNote"></p>
    <button class="primary" id="sendBtn" onclick="sendResults()">📨 Отправить учителю</button>
    <div class="feedback" id="sendFb"></div>
    <textarea id="copyBox" class="hidden" style="width:100%;height:180px;font:13px monospace;margin-top:8px"></textarea>
    <div id="review" class="hidden" style="margin-top:12px"></div>
  </div>
</div>
</div>

const $=id=>document.getElementById(id);
const KEY="topik_test1_state_v1";
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){ return (s||"").normalize("NFC").replace(/[\s.,!?·~]/g,""); }
const form=w=>w.f||w.ko;
const related=(a,b)=>a.ko.includes(b.ko)||b.ko.includes(a.ko);
const POOL=SETS.filter(s=>s.my).flatMap(s=>s.words);

let S=null; // {name, started, qs:[...], i, answers:[], finished, sent}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function load(){ try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null} }

function makeTest(){
  const words=[]; shuffle(POOL).forEach(w=>{ if(!words.some(x=>related(x,w))) words.push(w); });  // без пар вроде 지진 / 지진이 나다
  let k=0; const qs=[];
  const distract=(w,f)=>shuffle(POOL.filter(x=>x!==w&&!related(x,w)&&f(x)!==f(w))).slice(0,3).map(f);
  for(let n=0;n<PLAN.tr;n++){ const w=words[k++]; qs.push({t:"tr",ko:w.ko,ans:w.ru,opts:shuffle([w.ru,...distract(w,x=>x.ru)])}); }
  for(let n=0;n<PLAN.ctx;n++){ const w=words[k++], f=form(w), i=w.ex.indexOf(f);
    qs.push({t:"ctx",ko:w.ko,ans:w.ko,before:w.ex.slice(0,i),after:w.ex.slice(i+f.length),exRu:w.exRu,opts:shuffle([w.ko,...distract(w,x=>x.ko)])}); }
  for(let n=0;n<PLAN.wr;n++){ const w=words[k++]; qs.push({t:"wr",ko:w.ko,ans:w.ko,ru:w.ru}); }
  return qs;
}

function start(){
  const n=$("nameInput").value.trim(); if(!n){$("nameInput").focus();return;}
  const old=load();
  if(old&&old.name===n&&!old.sent) S=old;                     // продолжить, если страницу случайно закрыли
  else S={name:n,started:Date.now(),qs:makeTest(),i:0,answers:[],finished:false,sent:false};
  save(); $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("who").textContent=S.name;
  tick(); TIMER=setInterval(tick,1000);
  if(S.finished) finish(); else show();
}
let TIMER=null, pick=null;
function left(){ return MINUTES*60-Math.floor((Date.now()-S.started)/1000); }
function tick(){ const l=Math.max(0,left()); $("timer").textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0"); $("timer").classList.toggle("low",l<=60);
  if(l<=0&&!S.finished){ finish(true); } }

const TASK={tr:"Выбери перевод.",ctx:"Какое слово пропущено? Варианты в словарной форме.",wr:"Напиши слово по-корейски."};
function show(){
  const q=S.qs[S.i]; pick=null;
  $("bar").style.width=(100*S.i/S.qs.length)+"%"; $("qNum").textContent="Вопрос "+(S.i+1)+" из "+S.qs.length; $("qTask").textContent=TASK[q.t];
  $("qOpts").innerHTML=""; $("nextBtn").disabled=true;
  if(q.t==="wr"){ $("qPrompt").innerHTML=esc(q.ru); $("qWrite").classList.remove("hidden"); $("qIn").value=""; $("qIn").oninput=()=>$("nextBtn").disabled=!$("qIn").value.trim(); $("qIn").focus(); return; }
  $("qWrite").classList.add("hidden");
  $("qPrompt").innerHTML=q.t==="tr"?'<span class="ko">'+esc(q.ko)+'</span>'
    :'<span class="ko" style="font-size:21px;font-weight:500">'+esc(q.before)+'<b style="color:var(--accent)">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</b>'+esc(q.after)+'</span><div class="muted" style="font-size:15px;font-weight:400;margin-top:6px">'+esc(q.exRu)+'</div>';
  q.opts.forEach(o=>{ const b=document.createElement("button"); b.textContent=o; if(q.t==="ctx") b.className="ko";
    b.onclick=()=>{ [...$("qOpts").children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick=o; $("nextBtn").disabled=false; };
    $("qOpts").appendChild(b); });
}
function answerWrite(){ if($("qIn").value.trim()) next(); }
function next(){
  if(S.finished) return; const q=S.qs[S.i];
  const given=q.t==="wr"?$("qIn").value.trim():pick; if(!given) return;
  S.answers[S.i]=given; S.i++; save();
  if(S.i>=S.qs.length) finish(); else show();
}
function isOk(q,a){ return a!=null && (q.t==="wr"?norm(a)===norm(q.ans):a===q.ans); }
function finish(timeout){
  S.finished=true; if(!S.endedAt) S.endedAt=Date.now(); save(); clearInterval(TIMER);
  $("qCard").classList.add("hidden"); $("doneCard").classList.remove("hidden");
  const answered=S.answers.filter(a=>a!=null).length;
  $("doneTitle").textContent=(timeout||answered<S.qs.length)?"⏰ Время вышло":"✅ Тест закончен";
  $("doneNote").textContent="Отвечено: "+answered+" из "+S.qs.length+". Нажми «Отправить учителю».";
  if(S.sent) showReview();
}
function score(){ return S.qs.filter((q,i)=>isOk(q,S.answers[i])).length; }
function qLabel(q){ return q.t==="tr"?q.ko:q.t==="ctx"?q.before+"(  )"+q.after:q.ru; }
function buildReport(){
  const secs=Math.round(((S.endedAt||Date.now())-S.started)/1000);
  let t="📝 <b>Проверочная · 어휘</b>\n👤 "+esc(S.name)+"\n🕒 "+new Date(S.started).toLocaleString("ru-RU")+" · "+Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0")+"\n🎯 <b>"+score()+" / "+S.qs.length+"</b>\n";
  const NAME={tr:"Перевод",ctx:"Слово в предложении",wr:"Написание"};
  let last=null;
  S.qs.forEach((q,i)=>{ if(q.t!==last){ t+="\n<b>"+NAME[q.t]+"</b>"; last=q.t; }
    const a=S.answers[i], ok=isOk(q,a);
    t+="\n"+(ok?"✅ ":"❌ ")+(i+1)+". "+esc(qLabel(q))+(ok?" — "+esc(a):" — ответ: "+esc(a==null?"не успел(а)":a)+" → правильно: "+esc(q.ans)); });
  return t;
}
function showReview(){
  let h='<h3>Твои ответы: '+score()+' / '+S.qs.length+'</h3><table class="res">';
  S.qs.forEach((q,i)=>{ const a=S.answers[i], ok=isOk(q,a);
    h+='<tr><td>'+(ok?"✅":"❌")+'</td><td class="ko">'+esc(qLabel(q))+'</td><td class="ko">'+(ok?esc(a):'<s>'+esc(a==null?"—":a)+'</s> <b>'+esc(q.ans)+'</b>')+'</td></tr>'; });
  $("review").innerHTML=h+'</table>'; $("review").classList.remove("hidden");
}
function chunks(text){ const out=[]; let cur=""; text.split("\n").forEach(l=>{ if((cur+"\n"+l).length>3800){ out.push(cur); cur=l; } else cur=cur?cur+"\n"+l:l; }); if(cur)out.push(cur); return out; }
async function sendResults(){
  const text=buildReport(); $("sendBtn").disabled=true; $("sendFb").textContent="Отправляю…";
  try{ for(const part of chunks(text)){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:part,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description); }
    $("sendFb").textContent="✅ Отправлено! 수고했어요!"; S.sent=true; save(); showReview(); }
  catch(e){ $("sendBtn").disabled=false; $("sendFb").textContent="Не получилось отправить ("+e.message+"). Скопируй текст и отправь учителю вручную:"; const b=$("copyBox"); b.value=text.replace(/<\/?b>/g,""); b.classList.remove("hidden"); b.select(); }
}
</script>
